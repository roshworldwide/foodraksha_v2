name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit tests · Build
    runs-on: ubuntu-latest
    env:
      # The environment is validated at import, so build/typecheck need these
      # present. They are dummy values — nothing here connects to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  integration:
    name: Integration & e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodraksha
          POSTGRES_PASSWORD: foodraksha
          POSTGRES_DB: foodraksha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://foodraksha:foodraksha@localhost:5432/foodraksha_test
      AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Apply migrations the same way production does — never a reset.
      - run: npx prisma migrate deploy
      - run: npm run db:seed
        env:
          SEED_ADMIN_PASSWORD: ci-admin-password
      # test:integration loads .env via --env-file; in CI the env is already
      # set, so run the same command without that flag.
      - run: node --import tsx --test "src/**/*.itest.ts"
